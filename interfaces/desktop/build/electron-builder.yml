# Paths are relative to interfaces/desktop (the project folder), not to this file.
appId: com.luna.desktop
productName: Luna
copyright: Copyright (c) 2026 L.U.N.A. contributors
directories:
  buildResources: resources
  output: ../../dist/desktop
npmRebuild: false
# The in-app updater reads latest*.yml from GitHub Releases. Builds run with
# --publish never; the release workflow attaches the files.
publish:
  provider: github
  owner: Sehastrajit-S
  repo: Luna
files:
  - src/**/*
  - resources/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web/dist
    filter: ["**/*"]
  - from: ../../server
    to: server
    filter: ["**/*", "!__pycache__/**", "!*.pyc"]
  # uv sets up the app's own Python on first launch (see src/main/server/python-runtime.js).
  # Fetched by scripts/fetch-uv.mjs; one binary per build target.
  - from: vendor/uv/${platform}-${arch}
    to: uv/${platform}-${arch}
win:
  # The zip uses this name; the installer sets its own below.
  artifactName: Luna-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: resources/logo_icon.png
mac:
  artifactName: Luna-${version}-macos-${arch}.${ext}
  category: public.app-category.productivity
  icon: resources/icon.png
  # Signed when a Developer ID certificate is provided (CSC_LINK); the release workflow
  # passes -c.mac.identity=null otherwise, and Gatekeeper asks once (right-click, Open).
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  artifactName: Luna-${version}-linux-${arch}.${ext}
  category: Utility
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
nsis:
  artifactName: Luna-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  uninstallDisplayName: L.U.N.A.
