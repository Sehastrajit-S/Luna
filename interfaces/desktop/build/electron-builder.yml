# Paths are relative to interfaces/desktop (the project folder), not to this file.
appId: com.luna.desktop
productName: Luna
copyright: Copyright (c) 2026 L.U.N.A. contributors
directories:
  buildResources: resources
  output: ../../dist/desktop
npmRebuild: false
files:
  - src/**/*
  - resources/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web/dist
    filter: ["**/*"]
  - from: ../../server
    to: server
    filter: ["**/*", "!__pycache__/**", "!*.pyc"]
win:
  # The zip uses this name; the installer sets its own below.
  artifactName: Luna-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: resources/logo_icon.png
mac:
  artifactName: Luna-${version}-macos-${arch}.${ext}
  category: public.app-category.productivity
  icon: resources/icon.png
  # Unsigned: Gatekeeper asks once (right-click, Open). Signing needs an Apple Developer ID.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  artifactName: Luna-${version}-linux-${arch}.${ext}
  category: Utility
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
nsis:
  artifactName: Luna-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  uninstallDisplayName: L.U.N.A.
