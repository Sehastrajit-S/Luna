name: Container image

# Every pull request and push to main: build the image and smoke-test it
# (the server starts, answers /api/system/health and serves the web UI).
# Every published release: build for amd64 + arm64 and push to
# ghcr.io/sehastrajit-s/luna as :<version> and :latest.

on:
  pull_request:
    paths: ["server/**", "interfaces/desktop/src/renderer/**", "interfaces/desktop/resources/**", "Dockerfile", ".dockerignore", "alembic.ini", ".github/workflows/docker.yml"]
  push:
    branches: [main]
    paths: ["server/**", "interfaces/desktop/src/renderer/**", "interfaces/desktop/resources/**", "Dockerfile", ".dockerignore", "alembic.ini", ".github/workflows/docker.yml"]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sehastrajit-s/luna

jobs:
  smoke-test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: luna:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start and check health and web UI
        run: |
          docker run -d --name luna -p 127.0.0.1:8899:8899 -e background_jobs_enabled=false luna:test
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8899/api/system/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8899/api/system/health > /dev/null
          curl -fsS http://127.0.0.1:8899/ | grep -q "<title>Luna</title>"
          curl -fsS "http://127.0.0.1:8899/api/news?category=top" > /dev/null
          echo "Container is healthy and serves the web UI."
      - name: Logs
        if: always()
        run: docker logs luna 2>&1 | tail -80

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./interfaces/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
