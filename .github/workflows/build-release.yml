name: Build & Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Build backend binary
        run: pyinstaller build-backend/luna-backend.spec --distpath dist-backend --noconfirm

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --workspace=frontend --workspace=electron

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build logo assets
        run: npm run assets:logo

      - name: Package Electron app
        run: npm run build:win --workspace=electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/Luna-Setup-*.exe
            dist-electron/Luna-Setup-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
