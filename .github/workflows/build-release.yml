name: Build & Release

# Publishing a GitHub Release builds every app and attaches it to the release:
#
#   Luna-Setup-<v>.exe, Luna-<v>-windows-x64.zip       Windows desktop app
#   Luna-<v>-macos-arm64.dmg / -macos-x64.dmg (+ zip)   macOS desktop app (unsigned)
#   Luna-<v>-linux-x86_64.AppImage / -linux-arm64.AppImage Linux desktop app
#   Luna-<v>-android.apk                                Android app (debug-signed)
#   Luna-<v>-ios-simulator.zip                          iOS simulator build
#   Luna-<v>-server.zip                                 Server + web UI, any OS with Python
#   SHA256SUMS-<v>.txt, Luna-<v>.intoto.jsonl           Checksums and build provenance
#
# "Run workflow" (manual) builds them as downloadable artifacts only.
# The version is interfaces/desktop/package.json's "version"; see docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows desktop app ─────────────────────────────────────────────────────
  windows:
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix interfaces/desktop

      # Code-signed when the WIN_CSC_* secrets exist (a .pfx as base64 + its password); unsigned otherwise.
      - name: Build web UI and installer
        run: npm run build:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/desktop/Luna-Setup-*.exe
            dist/desktop/Luna-Setup-*.exe.blockmap
            dist/desktop/Luna-*-windows-x64.zip
            dist/desktop/latest.yml
          if-no-files-found: error
          retention-days: 14

  # ── macOS desktop app (unsigned) ────────────────────────────────────────────
  macos:
    name: macOS desktop app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix interfaces/desktop

      # Signed and notarized when the MAC_* and APPLE_* secrets exist; unsigned otherwise.
      - name: Build web UI and app (arm64 + x64)
        run: |
          npm run build
          if [ -n "$CSC_LINK" ]; then
            EXTRA=""
            [ -n "$APPLE_ID" ] && EXTRA="-c.mac.notarize=true"
            npm --prefix interfaces/desktop run build:mac -- $EXTRA
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npm --prefix interfaces/desktop run build:mac -- -c.mac.identity=null
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/desktop/Luna-*-macos-*.dmg
            dist/desktop/Luna-*-macos-*.zip
            dist/desktop/Luna-*-macos-*.blockmap
            dist/desktop/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # ── Linux desktop app ───────────────────────────────────────────────────────
  linux:
    name: Linux desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix interfaces/desktop

      - name: Build web UI and AppImages (x64 + arm64)
        run: |
          npm run build
          npm --prefix interfaces/desktop run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/desktop/Luna-*-linux-*.AppImage
            dist/desktop/latest-linux*.yml
          if-no-files-found: error
          retention-days: 14

  # ── Android app ─────────────────────────────────────────────────────────────
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build web UI and sync it into the Android project
        run: |
          npm run build
          cd interfaces/mobile && npx cap sync android

      - name: Build APK (debug-signed)
        run: |
          chmod +x interfaces/mobile/android/gradlew
          cd interfaces/mobile/android && ./gradlew assembleDebug --no-daemon

      - name: Collect into dist/android
        run: |
          VERSION=$(node -p "require('./interfaces/desktop/package.json').version")
          mkdir -p dist/android
          cp interfaces/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/android/Luna-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/Luna-*-android.apk
          if-no-files-found: error
          retention-days: 14

  # ── iOS (simulator build; App Store builds need signing) ─────────────────────
  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web UI and sync it into the iOS project
        run: |
          npm run build
          cd interfaces/mobile && npx cap sync ios

      - name: Build for the iOS simulator (no signing)
        run: |
          cd interfaces/mobile/ios/App
          xcodebuild -resolvePackageDependencies -scheme App -project App.xcodeproj CODE_SIGNING_ALLOWED=NO | tail -5
          xcodebuild build -scheme App -project App.xcodeproj -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build | tail -20

      - name: Collect into dist/ios
        run: |
          VERSION=$(node -p "require('./interfaces/desktop/package.json').version")
          APP=$(find interfaces/mobile/ios/App/build -name "*.app" -type d | head -1)
          mkdir -p dist/ios
          (cd "$(dirname "$APP")" && zip -qr "$GITHUB_WORKSPACE/dist/ios/Luna-${VERSION}-ios-simulator.zip" "$(basename "$APP")")

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/ios/Luna-*-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  # ── Server + web UI bundle (web local / web remote without Docker) ──────────
  server:
    name: Server bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the server and web UI
        run: |
          VERSION=$(node -p "require('./interfaces/desktop/package.json').version")
          NAME="Luna-${VERSION}-server"
          STAGE="dist/server/stage/${NAME}"
          mkdir -p "$STAGE/interfaces/desktop/src"
          cp -r server alembic.ini LICENSE README.md .env.example "$STAGE/"
          cp -r interfaces/desktop/src/renderer "$STAGE/interfaces/desktop/src/"
          cp -r interfaces/desktop/resources "$STAGE/interfaces/desktop/"
          cp -r interfaces/office "$STAGE/interfaces/"
          mkdir -p "$STAGE/docs" && cp docs/SETUP.md docs/REMOTE.md "$STAGE/docs/"
          find "$STAGE" -name "__pycache__" -type d -prune -exec rm -rf {} +
          cat > "$STAGE/START.txt" <<EOF
          Luna ${VERSION} server: the API plus the web UI, for any OS with Python 3.10+.

            python -m venv .venv
            .venv/bin/pip install -r server/requirements.txt        (Windows: .venv\Scripts\pip)
            .venv/bin/python server/server.py                       (Windows: .venv\Scripts\python)

          Then open http://localhost:8899 and pick a model in Settings.
          To use it from your other devices, see docs/REMOTE.md (Tailscale).
          EOF
          (cd dist/server/stage && zip -qr "../${NAME}.zip" "$NAME")

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/server/Luna-*-server.zip
          if-no-files-found: error
          retention-days: 14

  # ── Checksums, provenance, and attach everything to the release ─────────────
  publish:
    name: Checksums and release assets
    needs: [windows, macos, linux, android, ios, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      # Copies without the version in the name, so these links always fetch the newest release:
      #   https://github.com/<repo>/releases/latest/download/Luna-Setup.exe
      - name: Fixed-name download links
        run: |
          VERSION=$(node -p "require('./interfaces/desktop/package.json').version")
          cd dist/release
          cp "Luna-Setup-${VERSION}.exe"                 Luna-Setup.exe
          cp "Luna-${VERSION}-macos-arm64.dmg"           Luna-macos-arm64.dmg
          cp "Luna-${VERSION}-macos-x64.dmg"             Luna-macos-x64.dmg
          cp "Luna-${VERSION}-linux-x86_64.AppImage"     Luna-linux-x86_64.AppImage
          cp "Luna-${VERSION}-linux-arm64.AppImage"      Luna-linux-arm64.AppImage
          cp "Luna-${VERSION}-android.apk"               Luna-android.apk
          cp "Luna-${VERSION}-server.zip"                Luna-server.zip

      - name: Write SHA256SUMS
        id: sums
        run: |
          VERSION=$(node -p "require('./interfaces/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd dist/release
          sha256sum Luna-* latest*.yml | sort -k2 > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/Luna-*

      - name: Save the provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/release/Luna-${{ steps.sums.outputs.version }}.intoto.jsonl"

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*

      # The release page lists ~30 files (update feeds, blockmaps, provenance). Put a short
      # "Download" table at the top of the notes so people find the right one.
      - name: Add a download table to the release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          BODY=$(gh release view "$TAG" --json body --jq .body)
          if printf '%s' "$BODY" | grep -q '<!-- luna-downloads -->'; then exit 0; fi
          {
            echo '<!-- luna-downloads -->'
            echo '## Download'
            echo
            echo '| Platform | Download |'
            echo '|---|---|'
            echo "| **Windows** | [Luna-Setup.exe](${BASE}/Luna-Setup.exe) |"
            echo "| **macOS** | [Apple silicon](${BASE}/Luna-macos-arm64.dmg) · [Intel](${BASE}/Luna-macos-x64.dmg) |"
            echo "| **Linux** | [x86_64 AppImage](${BASE}/Luna-linux-x86_64.AppImage) · [arm64 AppImage](${BASE}/Luna-linux-arm64.AppImage) |"
            echo "| **Android** | [Luna-android.apk](${BASE}/Luna-android.apk) |"
            echo "| **Server / web UI** | \`docker run -d -p 127.0.0.1:8899:8899 -v luna_data:/app/data ghcr.io/sehastrajit-s/luna\` or [Luna-server.zip](${BASE}/Luna-server.zip) |"
            echo
            echo 'The desktop apps set everything up on first launch; no Python install needed. Other files below are for the in-app updater and for verifying downloads (`SHA256SUMS`, provenance).'
            echo
            printf '%s\n' "$BODY"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: checksums
          path: |
            dist/release/SHA256SUMS-*.txt
            dist/release/*.intoto.jsonl
          retention-days: 14

  # ── Package managers: winget and Homebrew ───────────────────────────────────
  # Always generates the manifests (uploaded as an artifact). Publishing is opt-in:
  #   HOMEBREW_TAP_TOKEN: PAT with push access to Sehastrajit-S/homebrew-luna
  #   WINGET_TOKEN:       classic PAT (public_repo) for opening winget-pkgs PRs
  #                       (the very first winget version is submitted by hand; see docs/RELEASING.md)
  package-managers:
    name: winget and Homebrew manifests
    needs: [publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "SHA256SUMS-${VERSION}.txt" --dir dist/sums
          node scripts/package-manifests.mjs "$VERSION" "dist/sums/SHA256SUMS-${VERSION}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: dist/packaging
          retention-days: 30

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping"; exit 0; fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Sehastrajit-S/homebrew-luna.git" tap
          mkdir -p tap/Casks
          cp dist/packaging/homebrew/Casks/luna.rb tap/Casks/luna.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/luna.rb
          git diff --cached --quiet && exit 0
          git commit -m "luna ${TAG#v}"
          git push

      - name: Check for a winget token
        id: winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: echo "enabled=$([ -n "$WINGET_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open the winget-pkgs update PR
        if: steps.winget.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Sehastrajit.Luna
          installers-regex: 'Luna-Setup-[0-9.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
