# Luna with a cloud model: no local Ollama needed.
#
#   docker compose -f deploy/compose.cloud.yml up -d
#   open http://localhost:8899  → Settings → AI model: pick a provider and paste its API key
#
# Or preset it in .env (copied from .env.example), e.g.:
#   llm_provider=openai-compatible
#   openai_base_url=https://openrouter.ai/api/v1      (OpenRouter: every major model behind one key)
#   openai_api_key=sk-or-...
#   openai_model=anthropic/claude-sonnet-4.5

services:
  luna:
    # Prebuilt image from GitHub releases; `docker compose up --build` builds it from this checkout instead.
    image: ghcr.io/sehastrajit-s/luna:latest
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: missing
    ports:
      # This computer only. For other devices use Tailscale (docs/SETUP.md).
      - "127.0.0.1:8899:8899"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - luna_data:/app/data
    restart: unless-stopped

volumes:
  luna_data:
    driver: local
