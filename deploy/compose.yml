# Luna + Ollama (local models on CPU).
#
#   docker compose -f deploy/compose.yml up -d
#   open http://localhost:8899
#
# Settings (model, API keys, name…) are set in the browser and kept in the
# luna_data volume. A .env in the repo root is optional and read if present.
#
# NVIDIA GPU:   docker compose -f deploy/compose.yml -f deploy/compose.gpu.yml up -d
# Cloud model:  docker compose -f deploy/compose.cloud.yml up -d   (no Ollama)
# Pull a model: docker compose -f deploy/compose.yml exec ollama ollama pull qwen2.5:7b

services:

  # ── Ollama: local model inference ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Luna: server + web UI ───────────────────────────────────────────────────
  luna:
    # Prebuilt image from GitHub releases; `docker compose up --build` builds it from this checkout instead.
    image: ghcr.io/sehastrajit-s/luna:latest
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: missing
    ports:
      # This computer only. To reach Luna from other devices, use Tailscale
      # (docs/SETUP.md) rather than publishing the port on your network.
      - "127.0.0.1:8899:8899"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.personal
        required: false
    environment:
      - ollama_base_url=http://ollama:11434
    volumes:
      - luna_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
  luna_data:
    driver: local
